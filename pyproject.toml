[project]
name = "f1-pitstop"
version = "1.0.0"
description = "ML-powered F1 pit stop strategy prediction using FastAPI and Streamlit"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Kman", email = "kman@example.com" }
]

# Production dependencies only
dependencies = [
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "streamlit>=1.28.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.3.2",
    "xgboost>=2.0.3",
    "catboost>=1.2.2",
    "cloudpickle>=3.0.0",
    "mlflow>=2.10.0",
    "pydantic>=2.5.0",
    "requests>=2.31.0",
    "imbalanced-learn>=0.11.0",
]

# Development dependencies
[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.10.0",
    "flake8>=6.1.0",
    "mypy>=1.7.0",
    "ipykernel>=7.16.0",
    "jupyter>=1.0.0",
    "notebook>=7.0.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
]

[tool.uv]
# Use Python 3.14 for builds
python-version = "3.14"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
